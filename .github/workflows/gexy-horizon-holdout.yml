name: GEXY Horizon Holdout

on:
  push:
    branches:
      - feature/gexy
    paths:
      - .github/workflows/gexy-horizon-holdout.yml
      - .gexy-trigger/horizon-holdout.txt
  workflow_dispatch:

jobs:
  horizon-holdout:
    if: github.actor == 'uciuscpa-design' && github.repository == 'uciuscpa-design/EFI-AI'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Run chronological horizon holdout
        run: |
          $repo = 'C:\Users\shannon\Documents\EFI-AI'
          if (-not (Test-Path $repo)) { throw "EFI-AI repo not found at $repo" }
          Set-Location $repo
          $env:PYTHONPATH = $repo
          git pull --ff-only origin feature/gexy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\gexy_shadow_horizon_holdout.py
          exit $LASTEXITCODE
