name: GEXY H5 Slope Invert v1

on:
  push:
    branches:
      - feature/gexy
    paths:
      - .github/workflows/gexy-h5-slope-invert-v1.yml
      - .gexy-trigger/h5-slope-invert-v1.txt
  workflow_dispatch:

jobs:
  evaluate:
    if: github.actor == 'uciuscpa-design' && github.repository == 'uciuscpa-design/EFI-AI'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Evaluate frozen H5 hypothesis
        run: |
          $repo = 'C:\Users\shannon\Documents\EFI-AI'
          if (-not (Test-Path $repo)) { throw "EFI-AI repo not found at $repo" }
          Set-Location $repo
          $env:PYTHONPATH = $repo
          git pull --ff-only origin feature/gexy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\gexy_h5_slope_invert_v1_report.py
          exit $LASTEXITCODE
