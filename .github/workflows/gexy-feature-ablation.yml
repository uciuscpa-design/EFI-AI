name: GEXY Feature Ablation

on:
  push:
    branches:
      - feature/gexy
    paths:
      - .github/workflows/gexy-feature-ablation.yml
      - .gexy-trigger/feature-ablation.txt
  workflow_dispatch:

jobs:
  feature-ablation:
    if: github.actor == 'uciuscpa-design' && github.repository == 'uciuscpa-design/EFI-AI'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Run advisory feature ablation
        run: |
          $repo = 'C:\Users\shannon\Documents\EFI-AI'
          if (-not (Test-Path $repo)) { throw "EFI-AI repo not found at $repo" }
          Set-Location $repo
          $env:PYTHONPATH = $repo
          git pull --ff-only origin feature/gexy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\gexy_shadow_feature_ablation.py
          exit $LASTEXITCODE
