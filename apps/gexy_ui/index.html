<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GEXY</title>
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#0b0d10;color:#e8edf2}
    .window{height:100%;display:flex;flex-direction:column}
    .toolbar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #242a31;flex-wrap:wrap}
    .toolbar label{font-size:12px;color:#9ca8b4}.toolbar select,.toolbar button{background:#141920;color:#e8edf2;border:1px solid #303943;border-radius:6px;padding:6px 9px}
    .chart{position:relative;flex:1;min-height:360px;overflow:hidden;background:linear-gradient(#10151b,#0b0d10)}
    .grid{position:absolute;inset:0;background-image:linear-gradient(#20262d 1px,transparent 1px),linear-gradient(90deg,#20262d 1px,transparent 1px);background-size:10% 20%;opacity:.55}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .legend{position:absolute;top:12px;left:12px;padding:9px;background:#0b0d10cc;border:1px solid #303943;border-radius:7px;font-size:12px}
    .status{font-size:12px;color:#9ca8b4;margin-left:auto}
  </style>
</head>
<body>
<div class="window">
  <div class="toolbar">
    <strong>GEXY</strong>
    <label>Horizon <select id="horizon"><option>1m</option><option selected>5m</option><option>15m</option><option>30m</option><option>60m</option></select></label>
    <label><input id="overlay" type="checkbox" checked> Forecast overlay</label>
    <label><input id="bands" type="checkbox" checked> Confidence band</label>
    <label><input id="levels" type="checkbox" checked> Gamma levels</label>
    <button id="fit">Fit chart</button>
    <span class="status" id="status">Replay / waiting for feed</span>
  </div>
  <div class="chart" id="chart">
    <div class="grid"></div>
    <canvas id="price"></canvas>
    <div class="legend" id="legend">SPX — GEXY forecast</div>
  </div>
</div>
<script>
const canvas=document.getElementById('price'),ctx=canvas.getContext('2d');
const resize=()=>{canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;draw()};
window.addEventListener('resize',resize);
const prices=[6500,6503,6499,6506,6504,6509,6507,6512,6510,6515,6513,6518];
function draw(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const pad=55,lo=Math.min(...prices)-8,hi=Math.max(...prices)+8;const y=v=>h-pad-(v-lo)/(hi-lo)*(h-2*pad);const x=i=>pad+i/(prices.length-1)*(w-2*pad);ctx.lineWidth=2;ctx.beginPath();prices.forEach((p,i)=>i?ctx.lineTo(x(i),y(p)):ctx.moveTo(x(i),y(p)));ctx.stroke();
 if(document.getElementById('overlay').checked){const move={"1m":2,"5m":5,"15m":9,"30m":14,"60m":20}[document.getElementById('horizon').value];const base=prices.at(-1),future=base+move;ctx.setLineDash([8,5]);ctx.beginPath();ctx.moveTo(x(prices.length-1),y(base));ctx.lineTo(w-pad,y(future));ctx.stroke();ctx.setLineDash([]);if(document.getElementById('bands').checked){ctx.globalAlpha=.15;ctx.fillRect(x(prices.length-1),Math.min(y(base+move*1.5),y(base-move*.5)),w-pad-x(prices.length-1),Math.abs(y(base-move*.5)-y(base+move*1.5)));ctx.globalAlpha=1;}}
 if(document.getElementById('levels').checked){ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(pad,y(6500));ctx.lineTo(w-pad,y(6500));ctx.stroke();ctx.setLineDash([])} }
['overlay','bands','levels','horizon'].forEach(id=>document.getElementById(id).addEventListener('change',draw));document.getElementById('fit').onclick=()=>{document.getElementById('status').textContent='Chart fitted';draw()};resize();
</script>
</body></html>
