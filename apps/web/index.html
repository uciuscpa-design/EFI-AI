<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EFI-AI Operator</title>
  <style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}button,input{padding:10px;margin:4px}section{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}pre{background:#f5f5f5;padding:12px;overflow:auto}</style>
</head>
<body>
<h1>EFI-AI Operator</h1>
<section><h2>Paper Trading</h2><input id="symbol" value="AAPL"><input id="bid" type="number" step="0.01" value="100"><input id="ask" type="number" step="0.01" value="100.10"><input id="qty" type="number" step="0.01" value="1"><button onclick="signal()">Generate Signal</button><button onclick="health()">Health</button></section>
<pre id="output">Ready.</pre>
<script>
const out=document.getElementById('output');
async function health(){const r=await fetch('/health');out.textContent=JSON.stringify(await r.json(),null,2)}
async function signal(){const body={symbol:symbol.value,bid:Number(bid.value),ask:Number(ask.value),quantity:Number(qty.value)};const r=await fetch('/v1/strategy/signal',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});out.textContent=JSON.stringify(await r.json(),null,2)}
</script>
</body></html>
